<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 在正文解析前处理旧链接和语言偏好；不隐藏正文，不等待外部脚本。 -->
    <script>
      (() => {
        const url = new URL(location.href);
        const explicit = url.searchParams.get("lang");
        const current = document.documentElement.lang;
        // 主地址默认英文；明确的中文页面或语言参数保留中文。
        const language = explicit === "en" || explicit === "zh-CN" ? explicit : current;
        if (language === current) return;
        const filename = url.pathname.split("/").pop() || "index.html";
        const base = filename.replace(/\.zh\.html$/, ".html");
        url.pathname = url.pathname.slice(0, url.pathname.lastIndexOf("/") + 1)
          + (language === "zh-CN" ? base.replace(/\.html$/, ".zh.html") : base);
        url.searchParams.set("lang", language);
        location.replace(url.href);
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="胡娇的双语个人网站：计算机科学、实用软件、业务系统与数字项目。" />
    <title>胡娇 — 项目</title>
    <link rel="stylesheet" href="site.css" />
    <script src="portfolio-data.js" defer></script>
    <script src="site-content.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body class="is-zh" data-page="projects">
    <!--
      THESIS: A personal website, not a recruitment landing page.
      OWN-WORLD: Near-white, warm charcoal, restrained terracotta; Manrope and native Chinese type.
      STORY: Meet Hu Jiao, then explore experience, projects, and photography on separate pages.
      FIRST VIEWPORT: A balanced reading column, modest name, personal subtitle, bio and contact.
      FORM: User-approved white preview, with subsequently approved copy and independent pages.
    -->
    <a class="skip-link" href="#main" data-i18n="skip">跳到主要内容</a>

    <header class="site-header">
      <a class="brand" href="index.zh.html?lang=zh-CN" aria-label="胡娇，首页" data-i18n-aria="brandLabel">
        <span data-i18n="profileName">胡娇</span>
      </a>

      <nav class="primary-nav" id="primary-nav" aria-label="主导航" data-i18n-aria="navLabel">
        <a href="index.zh.html?lang=zh-CN" data-page="home" data-i18n="navProfile">首页</a>
        <a href="experience.zh.html?lang=zh-CN" data-page="experience" data-i18n="navExperience">经历</a>
        <a href="projects.zh.html?lang=zh-CN" data-page="projects" data-i18n="navProject">项目</a>
        <a href="photography.zh.html?lang=zh-CN" data-page="photography" data-i18n="navGallery">摄影</a>
      </nav>

      <div class="header-actions">
        <button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" data-i18n-aria="menuLabel" aria-label="导航菜单">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16" /></svg>
        </button>
        <div class="language-switcher" role="group" aria-label="语言" data-i18n-aria="languageLabel">
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" data-lang="zh-CN" aria-pressed="true">中文</button>
        </div>
        <a class="header-email" href="mailto:jiaohu368@gmail.com" data-i18n="contactShort">邮件</a>
      </div>
    </header>

    <main id="main" class="page page-projects">
      <section class="resume-section section-observer" id="project" aria-labelledby="project-title">
        <header class="section-header">
          <h1 id="project-title" data-i18n="projectTitle">项目</h1>
        </header>
        <div class="section-content portfolio-list" id="portfolio-list" aria-live="polite"></div>
      </section>
    </main>
    <footer class="site-footer">
      <p data-i18n="location">澳大利亚悉尼</p>
      <p>© <span id="year"></span> <span data-i18n="profileName">胡娇</span></p>
    </footer>
  </body>
</html>
